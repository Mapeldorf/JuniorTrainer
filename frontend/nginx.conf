server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad HTTP (ver backend/app/security_headers.py para
    # el equivalente en la API). El bundle de produccion de Angular no lleva
    # <script>/<style> inline (ver angular.json: optimization.styles.
    # inlineCritical=false) ni atributos style="" inline (ver index.html),
    # asi que la CSP puede ser estricta sin "unsafe-inline".
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000 https://uwgqxdfpkkbenmynwlmk.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Angular router: cualquier ruta que no sea un fichero real cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
