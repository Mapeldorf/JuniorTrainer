@if (service.request(); as req) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="req.title"
    (keydown.escape)="cancel()"
  >
    <div class="card flex w-full max-w-[420px] flex-col gap-4 p-6">
      <h2 class="text-lg font-semibold tracking-tight text-content">{{ req.title }}</h2>
      <p class="whitespace-pre-wrap text-sm text-muted">{{ req.message }}</p>
      <div class="flex items-center justify-end gap-3">
        <button
          #cancelButton
          type="button"
          (click)="cancel()"
          class="btn btn-secondary"
        >
          {{ req.cancelLabel }}
        </button>
        <button
          type="button"
          (click)="confirm()"
          [class.btn-danger]="req.destructive"
          [class.btn-primary]="!req.destructive"
          class="btn"
        >
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
