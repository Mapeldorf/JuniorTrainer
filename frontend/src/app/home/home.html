<div class="min-h-screen bg-surface py-12">
  <div class="app-container flex flex-col gap-8">
    <app-brand-mark />

    <div class="card flex max-w-[420px] flex-col gap-4 p-8">
      <h1 class="text-2xl font-semibold tracking-tight text-content">Sesión iniciada</h1>
      @if (session(); as s) {
        <p class="text-muted">{{ s.user.email }} · rol: {{ role() ?? '—' }}</p>
      }
      <p class="text-sm text-muted">
        Las pantallas de generación, bloques y asignaciones llegan en los próximos pasos del plan de trabajo.
      </p>
      <button
        type="button"
        (click)="signOut()"
        class="btn btn-secondary w-full"
      >
        Cerrar sesión
      </button>
    </div>
  </div>
</div>
