<div class="flex min-h-screen items-center justify-center bg-surface px-8 py-12">
  <div class="card flex w-full max-w-[420px] flex-col gap-6 p-8">
    <app-brand-mark />

    <div class="flex flex-col gap-1">
      <h1 class="text-2xl font-semibold tracking-tight text-content">Recupera tu contraseña</h1>
      <p class="text-muted">Escribe tu email y te enviaremos un enlace para elegir una nueva.</p>
    </div>

    @if (!sent()) {
      <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
        <div class="flex flex-col gap-1.5">
          <label for="email" class="label">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="tu@empresa.com"
            class="input"
          />
        </div>
        <button
          type="submit"
          [disabled]="form.invalid || submitting()"
          class="btn btn-primary w-full"
        >
          {{ submitting() ? 'Enviando…' : 'Enviar enlace' }}
        </button>
      </form>
    } @else {
      <div class="flex items-start gap-2.5 rounded-[10px] border border-border bg-surface-overlay px-3.5 py-3 text-content">
        Si el email está registrado, recibirás un enlace para elegir una contraseña nueva.
      </div>
    }

    <a routerLink="/login" class="focus-ring self-start rounded-sm text-sm font-medium text-primary hover:underline">
      Volver a iniciar sesión
    </a>
  </div>
</div>
