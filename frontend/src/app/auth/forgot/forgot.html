<div class="flex min-h-screen items-center justify-center bg-zinc-50 px-8 py-12">
  <div class="flex w-full max-w-[420px] flex-col gap-6 rounded-xl border border-zinc-200 bg-white p-8">
    <app-brand-mark />

    <div class="flex flex-col gap-1">
      <h1 class="text-2xl font-semibold tracking-tight">Recupera tu contraseña</h1>
      <p class="text-zinc-600">Escribe tu email y te enviaremos un enlace para elegir una nueva.</p>
    </div>

    @if (!sent()) {
      <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-sm font-medium">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="tu@empresa.com"
            class="h-10 w-full rounded-lg border border-zinc-300 px-3 text-sm outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-700/30"
          />
        </div>
        <button
          type="submit"
          [disabled]="form.invalid || submitting()"
          class="flex h-10 items-center justify-center rounded-lg bg-blue-700 font-medium text-white hover:bg-blue-800 disabled:opacity-50"
        >
          {{ submitting() ? 'Enviando…' : 'Enviar enlace' }}
        </button>
      </form>
    } @else {
      <div class="flex items-start gap-2.5 rounded-[10px] bg-zinc-100 px-3.5 py-3 text-zinc-700">
        Si el email está registrado, recibirás un enlace para elegir una contraseña nueva.
      </div>
    }

    <a routerLink="/login" class="self-start text-sm font-medium text-blue-700 hover:underline">
      Volver a iniciar sesión
    </a>
  </div>
</div>
