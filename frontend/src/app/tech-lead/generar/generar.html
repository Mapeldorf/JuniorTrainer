<div class="min-h-screen bg-surface">
  <app-tech-lead-nav />

  <div class="app-container flex flex-col gap-6 py-10">
    <h1 class="text-2xl font-semibold tracking-tight text-content">Generar ejercicios</h1>

    <form
      (submit)="$event.preventDefault(); generar()"
      class="card flex max-w-[480px] flex-col gap-6 p-6"
    >
      @if (error()) {
        <p role="alert" class="alert-error">{{ error() }}</p>
      }

      <label class="flex flex-col gap-1.5 text-sm">
        <span class="label">Tecnologías a evaluar</span>
        <div class="flex gap-2">
          <input
            type="text"
            placeholder="p. ej. Git"
            [ngModel]="newTechnology()"
            (ngModelChange)="newTechnology.set($event)"
            name="newTechnology"
            (keydown.enter)="$event.preventDefault(); addTechnology()"
            class="input"
          />
          <button
            type="button"
            (click)="addTechnology()"
            class="btn btn-secondary shrink-0 px-3.5"
          >
            Añadir
          </button>
        </div>
        @if (technologies().length > 0) {
          <ul class="flex flex-wrap gap-2 pt-1">
            @for (tech of technologies(); track tech) {
              <li class="flex items-center gap-1.5 rounded-full border border-primary/30 bg-primary/10 px-3 py-1 text-sm text-primary">
                {{ tech }}
                <button
                  type="button"
                  (click)="removeTechnology(tech)"
                  [attr.aria-label]="'Quitar ' + tech"
                  class="focus-ring rounded-full font-medium hover:text-primary-hover"
                >
                  ×
                </button>
              </li>
            }
          </ul>
        } @else {
          <span class="text-sm text-muted">Añade al menos una tecnología.</span>
        }
      </label>

      <fieldset class="flex flex-col gap-1.5 text-sm">
        <legend class="label">Repositorio de GitHub (opcional)</legend>
        <div class="flex gap-2">
          <input
            type="text"
            placeholder="propietario (owner)"
            [ngModel]="owner()"
            (ngModelChange)="owner.set($event); onOwnerOrRepoChange()"
            name="owner"
            class="input w-1/2"
          />
          <input
            type="text"
            placeholder="repositorio"
            [ngModel]="repo()"
            (ngModelChange)="repo.set($event); onOwnerOrRepoChange()"
            name="repo"
            class="input w-1/2"
          />
        </div>
        <span class="text-sm text-muted">
          Déjalo vacío para generar solo a partir de las tecnologías, sin código real.
        </span>
      </fieldset>

      <fieldset class="flex flex-col gap-1.5 text-sm">
        <legend class="label">Tipo de ejercicio</legend>
        <label class="flex items-center gap-2 text-content">
          <input
            type="radio"
            name="kind"
            value="knowledge"
            [ngModel]="kind()"
            (ngModelChange)="kind.set($event)"
            class="accent-primary"
          />
          Conocimiento
        </label>
        <label class="flex items-center gap-2 text-content">
          <input
            type="radio"
            name="kind"
            value="debug"
            [disabled]="!hasRepo()"
            [ngModel]="kind()"
            (ngModelChange)="kind.set($event)"
            class="accent-primary"
          />
          Depuración (exige repositorio)
        </label>
        <label class="flex items-center gap-2 text-content">
          <input
            type="radio"
            name="kind"
            value="both"
            [disabled]="!hasRepo()"
            [ngModel]="kind()"
            (ngModelChange)="kind.set($event)"
            class="accent-primary"
          />
          Ambos (exige repositorio)
        </label>
      </fieldset>

      <label class="flex flex-col gap-1.5 text-sm">
        <span class="label">Número de ejercicios candidatos (1 a 5)</span>
        <input
          type="number"
          min="1"
          max="5"
          [ngModel]="count()"
          (ngModelChange)="count.set($event)"
          name="count"
          class="input w-28"
        />
      </label>

      <div class="flex items-center gap-3">
        <button
          type="submit"
          [disabled]="!isValid() || submitting()"
          class="btn btn-primary"
        >
          {{ submitting() ? 'Generando…' : 'Generar' }}
        </button>
        <button
          type="button"
          (click)="cancelar()"
          class="btn btn-secondary"
        >
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
