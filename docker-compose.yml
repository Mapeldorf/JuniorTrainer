services:
  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LITELLM_URL: http://litellm:4000
    depends_on:
      - litellm
      - agent-web
      - agent-code
      - agent-exercises
      - agent-evaluator
      - agent-reviewer
      - agent-validator

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@litellm-db:5432/${LITELLM_DB_NAME}
      # Guardrail presidio-pii (propuesta litellm-presidio-pii-masking):
      # URLs internas fijas, no son secretos, no van en .env.
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      # Credenciales propias de /ui (propuesta litellm-admin-ui-credentials):
      # en cuanto UI_PASSWORD esta puesta, el login deja de aceptar
      # LITELLM_MASTER_KEY como contraseña de administrador.
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - litellm-db
      - presidio-analyzer
      - presidio-anonymizer
    # Verificado (propuesta litellm-lakera-guardrail): un fallo de red al
    # llamar al guardrail (host inalcanzable, no solo rechazo de conexion)
    # puede tumbar el proceso entero (SIGSEGV), no solo bloquear la llamada.
    # Reinicio automatico como red de seguridad ante ese caso.
    restart: unless-stopped

  # Postgres propio del control-plane de LiteLLM (gestion de virtual keys y
  # budgets, propuesta litellm-virtual-keys): deliberadamente NO el Postgres
  # de Supabase que ya reutilizan los agentes para memoria (AGENTS_PG_*).
  # LiteLLM aplica sus propias migraciones Prisma contra esta instancia al
  # arrancar; aislarla evita que una herramienta externa toque la base de
  # datos de la aplicacion.
  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: ${LITELLM_DB_NAME}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data

  # Redaccion de PII (propuesta litellm-presidio-pii-masking): dos servicios
  # autoalojados, sin credenciales ni coste por llamada (a diferencia de
  # Lakera). Los llaman litellm (red de seguridad global) y, desde el change
  # guardarrailes-por-capas, el evaluador y el revisor, que redactan en
  # origen (ver agents/evaluator/app/redaction.py y el gemelo del revisor);
  # nunca los llama el host -- expose, no ports, mismo patron que los
  # agentes. Version fijada (no :latest): ver hallazgo del SIGSEGV de
  # litellm:main-latest en litellm-lakera-guardrail.
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    expose:
      - "3000"

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362
    expose:
      - "3000"

  # Los agentes A2A internos (generacion, grupos 3-5; valoracion de
  # respuestas -- evaluador/revisor, grupos 3-4 de valoracion-respuestas):
  # sin puerto publicado al host (tarea 7.1 / 8.1) -- solo el backend les
  # habla, dentro de la red interna de Compose, por su nombre de servicio
  # (que coincide con el host que cada uno ya anuncia por defecto en su
  # propia Agent Card, ver agents/*/app/config.py y backend/app/config.py).
  agent-web:
    build: ./agents/web
    expose:
      - "8010"
    env_file: .env
    depends_on:
      - litellm

  agent-code:
    build: ./agents/code
    expose:
      - "8011"
    env_file: .env
    # Sin volumen de repos: lee el contenido directamente de la API de
    # GitHub (change acceso-repo-github-tool), nunca de una carpeta local.
    depends_on:
      - litellm

  agent-exercises:
    build: ./agents/exercises
    expose:
      - "8012"
    env_file: .env
    depends_on:
      - litellm

  # Los tres agentes que reciben texto escrito por una persona (la respuesta
  # del alumno en evaluador y revisor, los nombres de tecnologia en el
  # validador) consultan a Presidio directamente, al montar el prompt o al
  # admitir la peticion (change `guardarrailes-por-capas`): asi el texto sale
  # ya redactado del proceso del agente y ningun destinatario posterior --
  # incluido el detector de inyeccion y el proveedor de respaldo -- lo recibe
  # en claro. Las URLs no son secretos y van aqui, no en .env, igual que ya
  # ocurre en el servicio litellm.
  agent-evaluator:
    build: ./agents/evaluator
    expose:
      - "8013"
    env_file: .env
    environment:
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
    depends_on:
      - litellm
      - presidio-analyzer
      - presidio-anonymizer

  agent-reviewer:
    build: ./agents/reviewer
    expose:
      - "8014"
    env_file: .env
    environment:
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
    depends_on:
      - litellm
      - presidio-analyzer
      - presidio-anonymizer

  # Agente validador de tecnologias (change validacion-tecnologias-agente-juez):
  # juez que decide si las tecnologias de una generacion son tecnologias de
  # programacion, antes de lanzar el resto del flujo.
  agent-validator:
    build: ./agents/validator
    expose:
      - "8015"
    env_file: .env
    environment:
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
    depends_on:
      - litellm
      - presidio-analyzer
      - presidio-anonymizer

# La base de datos y la autenticacion de la aplicacion viven en Supabase
# (seccion 11 de la especificacion), no en este docker-compose. La unica
# excepcion es litellm-db: no es un dato de la aplicacion, es el
# control-plane de una herramienta externa (LiteLLM) con su propio ciclo de
# vida (ver propuesta litellm-virtual-keys).

volumes:
  litellm-db-data:
