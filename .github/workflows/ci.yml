name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.backend == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: pip install -r requirements.txt
      - name: Import check
        if: steps.changes.outputs.backend == 'true'
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          LANGFUSE_PUBLIC_KEY: dummy
          LANGFUSE_SECRET_KEY: dummy
          AGENT_SERVICE_TOKEN: dummy
          GITHUB_APP_ID: dummy
          GITHUB_APP_PRIVATE_KEY: dummy
        run: python -c "from app.main import app"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci
      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        run: npx ng build
      - name: Test
        if: steps.changes.outputs.frontend == 'true'
        run: npx ng test --no-watch

  # Cobertura de guardarrailes del proxy (change guardarrailes-por-capas):
  # comprobacion estatica sobre infra/litellm/config.yaml. No necesita red,
  # modelo ni secretos, asi que puede correr en cada PR -- a diferencia de las
  # comprobaciones verify_*.py de los agentes, que exigen el stack levantado.
  litellm-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            litellm:
              - 'infra/litellm/**'
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.litellm == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.changes.outputs.litellm == 'true'
        run: pip install pyyaml
      - name: Self-test de la comprobacion
        if: steps.changes.outputs.litellm == 'true'
        run: python infra/litellm/verify_guardrail_coverage.py --self-test
      - name: Cobertura de guardarrailes
        if: steps.changes.outputs.litellm == 'true'
        run: python infra/litellm/verify_guardrail_coverage.py

  # Suite de evaluacion de agentes en modo SIMULADO (change
  # suite-evaluacion-agentes): el modelo de cada agente se sustituye por un doble
  # guionizado, asi que no necesita red hacia proveedores, LiteLLM, base de datos
  # ni secretos. Ejecuta el codigo real de parseo, limites y reintento de los
  # agentes sobre el dataset dorado (evals/datasets). El modo real, que cuesta
  # dinero, NO corre aqui: se lanza a mano con `python -m evals.run --mode real`.
  agent-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            evals:
              - 'agents/evaluator/**'
              - 'agents/reviewer/**'
              - 'agents/validator/**'
              - 'agents/exercises/**'
              - 'agents/web/**'
              - 'agents/code/**'
              - 'evals/**'
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.evals == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/*/requirements.txt
      - name: Tests del propio arnes
        if: steps.changes.outputs.evals == 'true'
        run: python -m unittest discover -s evals -t . -p "test_*.py"
      - name: Entornos de los agentes (uno por agente, todos se llaman app)
        if: steps.changes.outputs.evals == 'true'
        run: |
          for agent in evaluator reviewer validator exercises web code; do
            python -m venv "agents/$agent/.venv"
            "agents/$agent/.venv/bin/pip" install --quiet -r "agents/$agent/requirements.txt"
          done
      - name: Evaluacion en modo simulado
        if: steps.changes.outputs.evals == 'true'
        run: python -m evals.run --mode simulated
