# Tres nombres logicos (seccion 11 de la especificacion): generator para los
# tres agentes de la generacion, evaluator y reviewer. El proveedor y el
# modelo concreto de cada uno se resuelven via variables de entorno, para no
# atar este fichero a un proveedor fijo.
#
# Placeholder de este paso: los agentes todavia no existen (llegan en el
# paso 2 del plan de trabajo), asi que estos modelos no reciben trafico
# real todavia. Rellena GENERATOR_MODEL / EVALUATOR_MODEL / REVIEWER_MODEL
# en .env con el identificador de modelo que entienda LiteLLM para tu
# proveedor (por ejemplo "anthropic/claude-sonnet-4-5" u "openrouter/...").
model_list:
  - model_name: generator
    litellm_params:
      model: os.environ/GENERATOR_MODEL
      api_key: os.environ/GENERATOR_API_KEY

  # Evaluador y revisor ya no vinculan la redaccion de PII aqui (change
  # `guardarrailes-por-capas`). La redaccion la hace ahora el propio agente al
  # montar el prompt, sobre el UNICO campo que escribe una persona -- la
  # respuesta del alumno--, porque el proxy recibe el prompt como una cadena
  # plana y no puede distinguir ese campo del codigo de apoyo. De ahi venian
  # los falsos positivos que `quitar-url-person-presidio` y
  # `presidio-solo-evaluador-revisor` tuvieron que contener recortando
  # entidades y agentes.
  #
  # `presidio-pii` sigue existiendo mas abajo como RED DE SEGURIDAD, ahora con
  # default_on: true, de modo que cualquier deployment -- presente o futuro--
  # nazca con redaccion sin que nadie tenga que acordarse de vincularla. Con la
  # redaccion del agente operativa, esa red no deberia sustituir nada nunca:
  # su tasa de activacion es la alarma de que un agente dejo de redactar.
  - model_name: evaluator
    litellm_params:
      model: os.environ/EVALUATOR_MODEL
      api_key: os.environ/EVALUATOR_API_KEY

  - model_name: reviewer
    litellm_params:
      model: os.environ/REVIEWER_MODEL
      api_key: os.environ/REVIEWER_API_KEY

  # Agente validador de tecnologias (change validacion-tecnologias-agente-juez):
  # el juez que decide si las tecnologias de una generacion son tecnologias
  # de programacion. Modelo general rapido. Se le vinculan guardarrailes en
  # modo BLOQUEO (presidio-pii-block, lakera-guard-block, mas abajo): su
  # input es texto introducido por el usuario y este es un gate restrictivo.
  - model_name: validator
    litellm_params:
      model: os.environ/VALIDATOR_MODEL
      api_key: os.environ/VALIDATOR_API_KEY
      guardrails: ["lakera-guard-block"]

  # Juez offline de calidad pedagogica (capstone §5.6, change juez-contenido):
  # un modelo frontier DISTINTO de los cuatro roles de produccion, para evitar
  # el sesgo de autopreferencia. No recibe trafico de negocio ni tiene fallback;
  # solo lo llama `evals/judge.py` desde el host, con la master key. La redaccion
  # global de PII (presidio-pii) le aplica como a cualquier deployment.
  - model_name: judge
    litellm_params:
      model: os.environ/JUDGE_MODEL
      api_key: os.environ/JUDGE_API_KEY

  # Fallback automatico a Hugging Face Inference Providers (propuesta
  # litellm-huggingface-fallback), si el modelo principal falla. Mismos
  # modelos que ya se usan en OpenRouter cuando existen en HF;
  # GLM-5.3-FlashX no tiene checkpoint publicado, GLM-5.3-Flash es el
  # equivalente abierto mas cercano (decision documentada en design.md).
  - model_name: generator-fallback-hf
    litellm_params:
      model: huggingface/deepseek-ai/DeepSeek-V4.1-Flash
      api_key: os.environ/HF_TOKEN

  # Estos dos deployments de respaldo NO llevaban guardarrailes mientras sus
  # primarios si: los guardarrailes se resuelven por deployment, asi que una
  # llamada desviada al proveedor de respaldo salia sin redactar, y el hueco
  # no era visible porque el fallback solo entra en juego cuando el principal
  # falla (change `guardarrailes-por-capas`). Ya no necesitan vinculo
  # explicito, porque `presidio-pii` es global; la invariante
  # "todo fallback cubre a su primario" la comprueba en CI
  # `infra/litellm/verify_guardrail_coverage.py`.
  - model_name: evaluator-fallback-hf
    litellm_params:
      model: huggingface/deepseek-ai/DeepSeek-V4.1-Flash
      api_key: os.environ/HF_TOKEN

  - model_name: reviewer-fallback-hf
    litellm_params:
      model: huggingface/zai-org/GLM-5.3-Flash
      api_key: os.environ/HF_TOKEN

  # Fallback del validador: MISMO modelo open-weight que el primario, pero
  # servido por otro proveedor (Hugging Face), para que el fallback siga
  # siendo independiente de verdad. Lleva los mismos guardarrailes en modo
  # bloqueo que el primario.
  - model_name: validator-fallback-hf
    litellm_params:
      model: huggingface/zai-org/GLM-5.3-Flash
      api_key: os.environ/HF_TOKEN
      guardrails: ["lakera-guard-block"]

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Red de seguridad adicional al timeout de 45s que ya tiene cada agente en
  # su cliente (agents/*/app/llm.py): si el proveedor subyacente se cuelga,
  # LiteLLM corta primero con un error estructurado, en vez de que el
  # cliente solo vea el socket cortado. Reducido de 40 a 20 (propuesta
  # litellm-huggingface-fallback): con 40, un timeout del modelo principal
  # seguido del fallback a Hugging Face sumaba 45s exactos -- sin margen
  # real frente al timeout de 45s del cliente (verificado, ver tasks.md
  # 4.1). Con 20, el peor caso (principal agota su timeout + fallback que
  # tambien agota el suyo) queda en 40s, con margen real.
  request_timeout: 20
  # Sin esto, el default de LiteLLM reintenta tras un timeout, y el tiempo
  # total hasta el error final supera por mucho los 45s del cliente --
  # justo lo que request_timeout=40 queria evitar (descubierto verificando
  # esta misma propuesta, ver tasks.md 2.3).
  num_retries: 0
  # Fallback automatico (propuesta litellm-huggingface-fallback): si la
  # llamada al modelo principal falla, LiteLLM reintenta contra el modelo
  # de Hugging Face antes de devolver el error al agente. Con num_retries=0
  # no hay reintentos previos contra el mismo modelo, asi que el fallback
  # se dispara en el primer fallo.
  fallbacks:
    - generator: [generator-fallback-hf]
    - evaluator: [evaluator-fallback-hf]
    - reviewer: [reviewer-fallback-hf]
    - validator: [validator-fallback-hf]

# Virtual keys por agente (propuesta litellm-virtual-keys): master_key ya
# solo es para administracion (provision_keys.py y gestion manual), no la usa
# ningun agente para llamadas de negocio. database_url habilita el resto de
# tablas (keys, budgets, uso) que LiteLLM gestiona via Prisma en litellm-db.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# Dos guardarrailes, no cuatro (change `guardarrailes-por-capas`). El reparto
# se explica en una frase: AUTOMATICO para el control gratuito y autoalojado
# (Presidio, como red de seguridad en toda llamada), EXPLICITO para el de pago
# y externo (Lakera, solo donde de verdad bloquea).
#
# Lo que se elimino y por que:
#   - El `lakera-guard` GLOBAL en modo `monitor`. En modo observacion no
#     bloqueaba nada y no habia ningun consumidor de la senal, asi que no
#     actuaba como control; corria sobre los seis agentes, con coste por
#     llamada y latencia en `pre_call`; y, por ser global, se ejecutaba ANTES
#     que los guardarrailes de deployment y enmascaraba la PII antes de que el
#     guardarrail de bloqueo pudiera verla -- de ahi venia el
#     `opted_out_global_guardrails` de la virtual key del validador, que
#     tambien desaparece. Tenia ademas una consecuencia de privacidad: Lakera,
#     un tercero de pago, recibia el texto del alumno SIN redactar.
#   - `presidio-pii-block`. El rechazo por dato personal del validador se
#     adelanta a la ADMISION del agente (`agents/validator/app/pii.py`), donde
#     no cuesta ni un token y se puede probar sin levantar nada.
guardrails:
  # Red de seguridad de redaccion de PII. `default_on: true`: se aplica a
  # TODOS los deployments, incluidos los que se anadan en el futuro, sin que
  # nadie tenga que acordarse de vincularla -- fail-safe donde es gratis.
  #
  # Ya NO es el control principal: la redaccion de verdad la hace cada agente
  # al montar el prompt, sobre el campo que escribio una persona
  # (`agents/evaluator/app/redaction.py`). Con eso operativo, esta red no
  # deberia sustituir nada nunca, asi que SU TASA DE ACTIVACION ES LA ALARMA
  # de que algun agente dejo de redactar un campo.
  #
  # MASK, no BLOCK: el objetivo es redactar, no rechazar la respuesta legitima
  # de un alumno. Entidades acotadas (change `quitar-url-person-presidio`):
  # URL y PERSON disparaban cientos de falsos positivos sobre rutas de codigo
  # (`X.service.ts` -> `<URL>rvice.ts`). `presidio_filter_scope: "input"`
  # (change `quitar-url-person-presidio`): el valor por defecto "both"
  # enmascara tambien la RESPUESTA del modelo, lo que corrompia el contenido
  # generado sin aportar proteccion -- el proveedor ya vio el input redactado.
  - guardrail_name: "presidio-pii"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      presidio_filter_scope: "input"
      default_on: true
      pii_entities_config:
        EMAIL_ADDRESS: "MASK"
        PHONE_NUMBER: "MASK"
        CREDIT_CARD: "MASK"
        IP_ADDRESS: "MASK"
        IBAN_CODE: "MASK"

  # Deteccion de prompt injection en modo BLOQUEO, vinculada por deployment
  # (no global) al validador y a su respaldo: es un gate default-deny y su
  # entrada es texto introducido por el usuario.
  #
  # Ya no hay doble llamada a Lakera: el guardarrail global desaparecio, asi
  # que esta es la unica. Y por eso tampoco hace falta excluir al validador de
  # nada.
  #
  # En la ruta de generacion (`generator` y su respaldo) NO se aplica: ahi las
  # unicas detecciones observadas fueron falsos positivos sobre rutas de
  # repositorio que contienen la palabra "role" (change
  # `fix-falso-positivo-lakera`). La mitigacion de inyeccion de esos agentes
  # es la delimitacion del contenido como dato en el prompt y el no tener
  # ninguna herramienta de escritura.
  - guardrail_name: "lakera-guard-block"
    litellm_params:
      guardrail: lakera_v2
      mode: "pre_call"
      default_on: false
      on_flagged: "block"
      api_key: os.environ/LAKERA_API_KEY
